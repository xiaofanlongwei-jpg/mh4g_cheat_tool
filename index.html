<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MH4G 発掘武器 チートコード作成ツール</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--card:#f4f4f6;--bd:#ccd;--ac:#c2410c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18181b;--fg:#eee;--card:#27272a;--bd:#444;--ac:#fb923c}}
body{background:var(--bg);color:var(--fg);font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;margin:0;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:1.2rem}label{display:block;margin:12px 0 4px;font-size:.9rem}
select,input[type=text]{width:100%;padding:8px;font-size:1rem;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;box-sizing:border-box}
pre{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:12px;font-size:1.05rem;overflow-x:auto}
button{padding:10px 18px;font-size:1rem;background:var(--ac);color:#fff;border:0;border-radius:6px}
.n{font-size:.8rem;opacity:.7}
</style>
</head>
<body>
<h1>MH4G 発掘武器 チートコード作成</h1>
<label>武器種</label><select id="cat"></select>
<label>武器</label><select id="wp"></select>
<label>装飾品</label><select id="deco"></select>
<label><input type="checkbox" id="lock"> 装飾品をロック（+8000）</label>
<label>属性</label><select id="el"></select>
<label>属性値（選んだ属性の種類に対応する値のみ表示）</label><select id="ev"></select>
<label id="bl">ボーナス</label><select id="bo"></select>
<label>武器倍率（14）</label><select id="mul"></select>
<label>斬れ味（15）</label><select id="sh"></select>
<p class="n">固定値：発掘フラグ・レア度 04,09／研磨発光 0E</p>
<pre id="out"></pre>
<button id="cp">コピー</button>
<script>
const $=id=>document.getElementById(id);
const h=(n,l)=>n.toString(16).toUpperCase().padStart(l,"0");
const CAT={"07":"大剣","08":"片手剣","09":"ハンマー","0A":"ランス","0B":"ライトボウガン","0C":"ヘビィボウガン","0D":"太刀","0E":"スラッシュアックス","0F":"ガンランス","10":"弓","11":"双剣","12":"狩猟笛","13":"操虫棍","14":"チャージアックス"};
const R={
"07":[["0073","ジークムント:赤橙緑青紫|雷剣:赤黄緑青紫|41式対飛竜大剣:赤黄緑青紫|輝剣:赤橙黄緑紫|封龍剣:赤黄緑青紫"],["00EC","海帝剣:赤黄緑青紫|アギト:赤橙黄青紫"]],
"08":[["0070","峯山小太刀:赤黄緑青紫|チュクチュク:赤黄緑青紫|ヒドゥンエッジ:赤橙緑青紫|マスターバング:赤黄緑青紫|ゴールドマロウ:赤黄緑青紫|フロストエッジ:赤橙青緑紫"],["00ED","ポイズンタバルジン:赤橙緑青紫|エペ=ギルタナス:赤橙緑青紫"]],
"09":[["0074","ヒドゥンブレイカー:赤黄緑青紫|星砕きプロメテオル:赤橙黄緑紫|ナナ＝トリ:赤緑橙青紫|鬼鉄丸:赤黄緑青紫|ウォーバッシュ:赤黄緑青紫|ねこハンマー:赤黄緑青紫"],["00ED","クリスタルノヴァ:橙黄緑青紫|ドラゴンブレイカー:桃赤黄緑青"]],
"0A":[["005D","バベル:赤黄緑青紫|トゥースランス:赤橙緑青紫|龍騎槍:赤黄緑青紫|合戦槍:赤黄緑青紫|シルバープロミネンス:赤橙黄緑紫"],["00CC","七星槍:紫赤黄緑青|エストック:桃赤緑青紫"]],
"0B":[["0054","ボルボバレット:赤黄緑青紫|雷砲:赤黄緑青紫"],["00AD","フリルパラソル:赤黄緑青紫|ベルクーツ:桃赤橙緑青"]],
"0C":[["003C","デュエルスタッブ:赤黄緑青紫|カオスウイング:赤橙緑青紫"],["0091","ギガン＝ショット:赤橙緑青紫|カホウ:赤黄緑青紫"]],
"0D":[["005D","成敗刀:赤黄緑青紫|軍刀:赤青橙黄緑|ラスティクレイモア:赤黄緑青紫|凍刃:赤青橙黄紫|飛竜刀:赤黄緑青紫"],["00D9","冥刀:赤橙黄緑青|天上天下無双刀:赤橙緑青紫"]],
"0E":[["0057","豪剣斧:桃橙緑青紫|ディーエッジ:赤橙緑青紫|王剣斧:桃黄緑青紫|ヒドゥンアックス:赤黄緑青紫|竜姫の剣斧:赤黄緑青紫"],["00BC","激流斧:桃橙緑青紫|モーターバースト:赤橙緑青紫"]],
"0F":[["0064","プリンセスバースト:桃黄緑青紫|フルボルテージ:桃橙黄緑青|ナナ＝ハウル:桃黄緑青紫|ジェネラルパルド:赤黄緑青紫|シルバールーク:赤橙緑青紫"],["00D1","砕牙砲:赤橙黄青紫|アームofティラン:桃橙黄緑紫"]],
"10":[["0057","覇弓レラカムトルム:赤黄緑青紫|プロミネンスボウ:赤黄緑青紫|クイーンブラスター:赤桃黄緑紫|鋼氷馬弓:赤橙緑青紫|殲滅と破壊の剛弓:赤黄緑青紫"],["00C2","エクリプスボウ:桃赤緑青紫|龍弓:橙黄緑青紫"]],
"11":[["006E","王双刃:桃黄緑青紫|ランポスクロウズ:桃黄緑青紫|テッセン:赤桃黄緑紫|祭囃子・無形ノ調:赤桃黄緑紫|ギルドナイトセーバー:桃黄緑青紫"],["00D9","海王双刃:赤黄緑青紫|ニヴルブリザード:桃橙黄緑青"]],
"12":[["0051","ガンズロック:赤桃黄緑青|獄琴:赤黄緑青紫|ウネリシェルン:桃橙緑青紫|ゴルトリコーダー:桃黄緑青紫"],["00AF","ソニックビードロー:桃赤橙緑青|ヒドゥントーン:赤黄緑青紫"]],
"13":[["008A","ボーンロッド:赤黄緑青紫|金砕棍棒:桃赤黄緑青|エイムofトリック:桃赤橙青紫|セクトハルパー:桃赤橙黄青"]],
"14":[["0069","精鋭討伐隊盾斧:桃橙黄緑青|ディア＝ルテミス:桃赤黄緑紫|フォースofフォール:赤橙緑青紫|ナバルクラノス:桃橙黄青紫"]]};
const EL=["なし","火","水","雷","龍","氷","毒","麻痺","睡眠","爆破"];
const N=s=>s.split(",").map(Number);
// [5属性(00-19), 4異常(00-11)] 奇数番目は(覚醒)値
const V={
L:[N("180,220,250,300,280,310,340,370,390,400,430,460,480,490,510,550,570,630,630,660,670,690,700,720,750,810"),N("210,250,250,280,270,300,280,310,300,330,330,360,360,390,400,430,450,480")],
S:[N("90,110,120,150,140,150,170,180,190,200,210,230,240,240,250,270,280,310,310,330,330,340,350,360,370,400"),N("100,120,120,140,130,150,140,150,150,160,160,180,180,190,200,210,220,240")],
M:[N("120,150,170,200,190,210,230,250,260,270,290,310,320,330,340,370,380,420,420,440,450,460,470,480,500,540"),N("140,170,170,190,180,200,190,210,200,220,220,240,240,260,270,290,300,320")]};
const cls=c=>["07","12"].includes(c)?"L":["08","10","11","13"].includes(c)?"S":"M";
const HORN="白赤青 白青赤 紫赤青 紫青赤 白赤緑 白緑赤 紫赤緑 紫緑赤 白赤空 白空赤 紫赤空 紫空赤 白赤黄 白黄赤 紫赤黄 紫黄赤 白青緑 白緑青 紫青緑 紫緑青 白青空 白空青 紫青空 紫空青 白青黄 白黄青 紫青黄 紫黄青 白緑空 白空緑 紫緑空 紫空緑 白緑黄 白黄緑 紫緑黄 紫黄緑 白空黄 白黄空 紫空黄 紫黄空 紫赤橙 紫橙赤 紫青橙 紫橙青 紫緑橙 紫橙緑 紫空橙 紫橙空 紫黄橙 紫橙黄 白白白".split(" ");
const BUG="クルドローン,エボクルドローン,アルマスタッグ,モナークブルスタッグ,レジナヴォランテ,ガシルドーレ,ドゥンクラープ,ウカドゥーレ,カゼキリバネ,オオシナト,シナトモドキ,エルドラーン,マルドローン,エボマルドローン,ザミールビートル,ケーニヒゴアビートル,フィルカーノ,ハルキータ,ドルンキータ,アルジョアーニャ,ガルーヘル,メイヴァーチル,ヴァンリエール,アルジャーノン,サンダーボール,オスパーダドゥーレ,シナトオオモミジ,サルヴァースタッグ,ドスエルドラーン,アムルマリキータ,ヴァルフリューゲル,グランツビートル,ドスアルジャーノン,光のルフ,バレットホーク".split(",");
function bonus(c){
 if(["07","09"].includes(c))return["武器倍率+なし","武器倍率+10","武器倍率+20"].map((x,i)=>i?x:"なし");
 if(["08","0A"].includes(c))return["なし","防御力+10","防御力+20","防御力+20","防御力+35"];
 if(["0D","11"].includes(c))return["なし","会心+10","会心+20"];
 if(c=="0E")return["強撃ビン","強属性ビン","麻痺ビン","滅龍ビン","減気ビン","毒ビン"];
 if(c=="14")return["榴弾ビン","強属性ビン"];
 if(c=="0F")return Array.from({length:51},(_,i)=>["通常","拡散","放射"][i%3]+" 砲撃Lv"+(Math.floor(i/3)+1));
 if(c=="12")return HORN.map(x=>"旋律: "+x);
 if(c=="13")return BUG;
 return["なし"];
}
function fill(sel,items){sel.innerHTML=items.map(([v,t])=>`<option value="${v}">${t}</option>`).join("")}
function weapons(c){const o=[];for(const[s,str]of R[c]){let id=parseInt(s,16);for(const g of str.split("|")){const[n,cs]=g.split(":");for(const ch of cs)o.push([h(id,4),`${n}【${ch}】 (${h(id++,4)})`])}}return o}
function onCat(){const c=$("cat").value;fill($("wp"),weapons(c));fill($("bo"),bonus(c).map((t,i)=>[h(i,2),`${h(i,2)}: ${t}`]));onEl();}
function onEl(){
 const e=+$("el").value,c=$("cat").value;
 if(e==0){fill($("ev"),[["00","00"]]);}
 else{const a=V[cls(c)][e>5?1:0];const sc=e>5?[["10","異常正規最高"],["11","異常正規覚醒最高"]]:[["18","通常属性正規最高"],["19","通常属性正規覚醒最高"]];
  const og=(l,it)=>`<optgroup label="${l}">`+it.map(([v,t])=>`<option value="${v}">${t}</option>`).join("")+"</optgroup>";
  $("ev").innerHTML=og("簡易選択",sc.map(([v,t])=>[v,`★${t} (${v}): ${a[parseInt(v,16)]}`]))+og("全属性値（"+(e>5?"異常":"通常")+"属性用）",a.map((v,i)=>[h(i,2),`${h(i,2)}: ${v}${i%2?"（覚醒）":""}`]));
  $("ev").value=h(e>5?16:24,2);}
 upd();
}
function upd(){
 let d=parseInt($("deco").value||"0",16)||0;if($("lock").checked)d|=0x8000;
 $("out").textContent=["B0ED36A8 00000000",
  "000002D6 "+$("wp").value+"00"+$("cat").value,
  "000002DA "+h(d,4)+h(+$("el").value,2)+$("ev").value,
  "000002E2 "+$("bo").value+"00"+$("mul").value+$("sh").value,
  "000002E6 0004090E"].join("\n");
}
fill($("cat"),Object.entries(CAT));
const eo=i=>`<option value="${i}">${EL[i]}</option>`;
$("el").innerHTML=eo(0)+'<optgroup label="通常属性">'+[1,2,3,4,5].map(eo).join("")+'</optgroup><optgroup label="異常属性">'+[6,7,8,9].map(eo).join("")+"</optgroup>";
$("el").value=5;
$("cat").onchange=onCat;$("el").onchange=onEl;
